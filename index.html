<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Mr Rabbit — welcome to the cult.">
  <title>Mr Rabbit</title>
  <style>
:root {
  font-family: 'Manrope', Arial, sans-serif;
  color: #f5f2ea;
  background: #050505;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  color-scheme: dark;
  --gold: #c5a45b;
  --black: #050505;
  --surface: #0b0b0b;
  --text-primary: #f5f2ea;
  --text-secondary: #a7a39a;
  --line: rgba(197, 164, 91, 0.25);
  --pointer-x: 50vw;
  --pointer-y: 45vh;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  min-height: 100%;
  background: var(--black);
}

body {
  min-width: 320px;
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  overflow-x: hidden;
  background: var(--black);
}

body,
a {
  font-family: 'Manrope', Arial, sans-serif;
}

::selection {
  color: var(--black);
  background: var(--gold);
}

.site-shell {
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  padding: 1.5rem clamp(1.15rem, 5vw, 4.5rem);
  background:
    radial-gradient(ellipse at 50% 48%, rgba(139, 105, 39, 0.065), transparent 36rem),
    linear-gradient(180deg, #070707 0%, #050505 58%, #060606 100%);
}

.ambient-light {
  position: fixed;
  z-index: -1;
  inset: 0;
  pointer-events: none;
  opacity: 0.14;
  background: radial-gradient(32rem circle at var(--pointer-x) var(--pointer-y), rgba(197, 164, 91, 0.2), transparent 72%);
}

.skip-link {
  position: absolute;
  z-index: 5;
  top: 0.75rem;
  left: 0.75rem;
  transform: translateY(-160%);
  border: 1px solid var(--gold);
  border-radius: 2px;
  padding: 0.7rem 1rem;
  color: var(--text-primary);
  background: var(--surface);
  text-decoration: none;
}

.skip-link:focus-visible {
  transform: translateY(0);
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}

.site-header {
  position: absolute;
  z-index: 2;
  top: clamp(1rem, 3.2vw, 2rem);
  left: clamp(1rem, 3.2vw, 2rem);
}

.logo-orbit {
  display: grid;
  width: clamp(5.25rem, 10vw, 7rem);
  aspect-ratio: 1;
  place-items: center;
  overflow: hidden;
  border: 1px solid rgba(197, 164, 91, 0.52);
  border-radius: 50%;
  background: #000;
  box-shadow: 0 0 22px rgba(197, 164, 91, 0.075);
}

.logo-orbit__image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  mix-blend-mode: lighten;
}

.main-content {
  display: flex;
  flex: 1 0 auto;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(1.75rem, 4vh, 2.6rem);
  width: min(100%, 760px);
  margin: 0 auto;
  padding: 7rem 0 2.5rem;
  text-align: center;
}

.about-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: reveal 800ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
}

.about-section__statement {
  margin: 0;
  color: var(--text-primary);
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(2.65rem, 7vw, 4.6rem);
  font-weight: 500;
  letter-spacing: 0;
  line-height: 1.25;
}

.about-section__rule {
  display: block;
  width: 2.4rem;
  height: 1px;
  margin-top: 1.1rem;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.social-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.85rem;
  width: min(100%, 610px);
}

.social-link-card {
  display: flex;
  min-height: 8rem;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.85rem;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1.15rem 0.8rem;
  color: var(--text-primary);
  background: rgba(11, 11, 11, 0.88);
  text-decoration: none;
  animation: reveal 500ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
  transition:
    transform 220ms ease,
    border-color 220ms ease,
    background-color 220ms ease,
    box-shadow 220ms ease;
}

.social-link-card:hover {
  transform: translateY(-3px);
  border-color: rgba(197, 164, 91, 0.78);
  background: #10100e;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22), 0 0 16px rgba(197, 164, 91, 0.07);
}

.social-link-card:active {
  transform: translateY(-1px) scale(0.995);
}

.social-link-card:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}

.social-link-card__icon {
  display: grid;
  width: 2.5rem;
  height: 2.5rem;
  flex: 0 0 2.5rem;
  place-items: center;
  border: 1px solid rgba(197, 164, 91, 0.28);
  border-radius: 50%;
  color: var(--gold);
  transition: border-color 220ms ease, background-color 220ms ease;
}

.social-link-card:hover .social-link-card__icon {
  border-color: rgba(197, 164, 91, 0.64);
  background: rgba(197, 164, 91, 0.07);
}

.icon {
  display: block;
  width: 1.15rem;
  height: 1.15rem;
}

.icon__fill {
  fill: currentColor;
  stroke: none;
}

.social-link-card__name {
  color: var(--text-primary);
  font-size: 0.95rem;
  font-weight: 400;
  line-height: 1.5;
}

@keyframes reveal {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 600px) {
  .site-shell {
    padding: 1rem 1.1rem;
  }

  .site-header {
    top: 1rem;
    left: 1rem;
  }

  .logo-orbit {
    width: 5.25rem;
  }

  .main-content {
    gap: 1.5rem;
    padding-top: 7.2rem;
    padding-bottom: 1.3rem;
  }

  .about-section__statement {
    font-size: clamp(2.2rem, 10vw, 3.6rem);
  }

  .social-list {
    grid-template-columns: 1fr;
    gap: 0.65rem;
    width: min(100%, 430px);
  }

  .social-link-card {
    min-height: 4.6rem;
    flex-direction: row;
    justify-content: flex-start;
    gap: 1rem;
    padding: 0.75rem 1rem;
    text-align: left;
  }

  .social-link-card__icon {
    width: 2.45rem;
    height: 2.45rem;
    flex-basis: 2.45rem;
  }
}

@media (max-width: 360px) {
  .logo-orbit {
    width: 4.75rem;
  }

  .about-section__statement {
    font-size: 2rem;
  }
}

@media (hover: none), (pointer: coarse) {
  .ambient-light {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

  </style>
